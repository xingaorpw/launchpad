name: promote

on:
  schedule:
    # 每周二 14:00 UTC（北京时间周二 22:00）
    - cron: "0 14 * * 2"
  workflow_dispatch:
    inputs:
      project:
        description: "项目名（留空则按周轮换）"
        required: false
        default: ""
      dry_run:
        description: "只预览，不真的发布"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pick project
        id: pick
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.project }}"
          if [ -n "$INPUT" ]; then
            PROJECT="$INPUT"
          else
            PROJECT=$(python -c "import datetime; from launchpad import content; p = content.load_all(); print(p[datetime.date.today().isocalendar().week % len(p)].name)")
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "本周项目：$PROJECT"

      - name: Show configured platforms
        run: python -m launchpad platforms

      - name: Publish
        env:
          PROJECT: ${{ steps.pick.outputs.project }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python -m launchpad post-auto --project "$PROJECT" $EXTRA
